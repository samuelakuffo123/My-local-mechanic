# Render Blueprint: one HTTPS service serving the client bundle and /api.
# Data lives in Neon Postgres, so the free plan needs no persistent disk.
services:
  - type: web
    name: mechnow
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "10000"
      # Neon pooled connection string for application traffic.
      - key: DATABASE_URL
        sync: false
      # Neon direct connection string, used only for migrations at boot.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Other services declared in neon.ts. The app does not consume them yet;
      # they are injected so `neon env pull` values are available at runtime.
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_FUNCTION_HOST_SUFFIX
        sync: false
      - key: NEON_AI_GATEWAY_BASE_URL
        sync: false
      - key: NEON_AI_GATEWAY_TOKEN
        sync: false
      - key: NEON_REALTIME_URL
        sync: false
      - key: NEON_REALTIME_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      # Public Mapbox token, needed at build time. Restrict it to this domain.
      - key: VITE_MAPBOX_ACCESS_TOKEN
        sync: false
      # Production must surface real backend failures instead of falling back
      # to local mock data when the API returns 502/503/504.
      - key: VITE_API_MODE
        value: server
      # Google Identity Services web client ID.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # First admin account. Password must be 12+ characters.
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Live mobile-money payments. Leave unset to keep payments disabled.
      - key: PAYMENTS_PROVIDER
        value: paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      # Phone OTP delivery through Arkesel's /api/otp/generate + /api/otp/verify
      # endpoints. OTP requires the Main SMS API Key, not a Multiple API Key.
      # Register the sender ID and keep credits topped up before public signup.
      - key: SMS_PROVIDER
        value: arkesel
      - key: ARKESEL_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        value: MechNow
